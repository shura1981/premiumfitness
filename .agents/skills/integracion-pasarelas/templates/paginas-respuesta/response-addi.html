  <!-- =====================================================================
       SCRIPTS

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
  <script>
    /**
     * Extrae el valor de un parámetro de la query string.
     * @param {string} param - Nombre del parámetro.
     * @returns {string|null}
     */
    function getQueryParam(param) {
      var foundValue = null;
      location.search.substr(1).split('&').some(function (item) {
        var kv = item.split('=');
        if (kv[0] === param) { foundValue = decodeURIComponent(kv[1]); return true; }
        return false;
      });
      return foundValue;
    }

    $(document).ready(function () {
      // ── 1. Leer el parámetro enviado por Addi en la URL de redirección ──
      var id_order = getQueryParam('id_order');
      if (id_order === null) {
        alert('Sin id de orden');
        return;
      }

      // ── 2. Consultar el estado de la transacción ──
      // El endpoint intermedio normaliza la respuesta al esquema canónico x_*
      var urlapp = '/api/state-transaction'
                 + '?id_visita=' + id_order;

      $.get(urlapp, function (response) {
        if (!response.success) {
          alert('Error consultando la información');
          return;
        }

        var data = response.data;

        // ── 3. Interpretar código de respuesta ──
        if (data.x_cod_response == 1) {
          console.log('transacción aceptada');
        } else if (data.x_cod_response == 2) {
          console.log('transacción rechazada');
        } else if (data.x_cod_response == 3) {
          console.log('transacción pendiente');
        } else if (data.x_cod_response == 4) {
          console.log('transacción fallida');
        }

        // ── 4. Rellenar la tabla HTML ──
        $('#referencia').text(data.x_id_invoice);
        $('#fecha').html(data.x_transaction_date);
        $('#respuesta').html(data.x_response);
        $('#motivo').text(data.x_response_reason_text);
        $('#banco').text(data.x_bank_name);
        $('#recibo').text(data.x_transaction_id);

        var formatter = new Intl.NumberFormat('en-US', {
          style: 'currency', currency: 'USD', minimumFractionDigits: 0
        });
        $('#total').text(formatter.format(data.x_amount) + ' ' + data.x_currency_code);
      });
    });

  </script>
