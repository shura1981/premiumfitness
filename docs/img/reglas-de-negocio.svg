<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="2140" viewBox="0 0 2560 2140" role="img" aria-labelledby="title desc">
<title id="title">PremiumFitness: reglas de negocio</title>
<desc id="desc">Diagrama de las once reglas de reglas-de-negocio.md: puntos del cinco por ciento antes de IVA, lotes con vencimiento de seis meses, canje sin descuento mediante FIFO, IVA para reportes, compras con descuento del veinticinco por ciento, incentivo de referido y acceso a dietas. El importe mensual de dietas queda por aclarar.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 H 0 V 40" fill="none" stroke="#b9d4df" stroke-width="1" opacity=".55"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#38566b"/></marker></defs>
<g font-family="DejaVu Sans, sans-serif">
<rect x="0" y="0" width="2560" height="2140" rx="0" fill="#edf8fc" stroke="none" stroke-width="2.5"/>
<rect x="0" y="0" width="2560" height="2140" rx="0" fill="url(#grid)" stroke="none" stroke-width="2.5"/>
<text x="60" y="77" font-size="49" fill="#172e41" font-weight="800" text-anchor="start">
<tspan x="60" dy="0">PREMIUMFITNESS</tspan>
</text>
<text x="62" y="124" font-size="28" fill="#496578" font-weight="400" text-anchor="start">
<tspan x="62" dy="0">Reglas de negocio · Puntos, compras, referidos y acceso a dietas</tspan>
</text>
<rect x="2120" y="42" width="380" height="75" rx="20" fill="#173e56" stroke="none" stroke-width="2.5"/>
<text x="2310" y="88" font-size="27" fill="#fff" font-weight="700" text-anchor="middle">
<tspan x="2310" dy="0">REGLAS 01–11</tspan>
</text>
<rect x="60" y="180" width="1450" height="1600" rx="24" fill="#f8fcfe" stroke="#bdd5e0" stroke-width="2.5"/>
<rect x="1540" y="180" width="960" height="1600" rx="24" fill="#f8fcfe" stroke="#bdd5e0" stroke-width="2.5"/>
<text x="90" y="230" font-size="29" fill="#172e41" font-weight="800" text-anchor="start">
<tspan x="90" dy="0">01  CICLO DE LOS PUNTOS Y CANJE</tspan>
</text>
<text x="1570" y="230" font-size="29" fill="#172e41" font-weight="800" text-anchor="start">
<tspan x="1570" dy="0">02  COMPRAS Y BENEFICIOS</tspan>
</text>
<rect x="350" y="280" width="870" height="110" rx="18" fill="#fff" stroke="#cb813b" stroke-width="2.5"/>
<text x="374" y="313" font-size="21" fill="#cb813b" font-weight="700" text-anchor="start">
<tspan x="374" dy="0">DISPARADOR · CLIENTE</tspan>
</text>
<text x="374" y="356" font-size="28" fill="#172e41" font-weight="700" text-anchor="start">
<tspan x="374" dy="0">Realizar una compra</tspan>
</text>
<path d="M 785 390 V 435" fill="none" stroke="#38566b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="180" y="435" width="1210" height="135" rx="18" fill="#fff" stroke="#2f7499" stroke-width="2.5"/>
<text x="204" y="468" font-size="21" fill="#2f7499" font-weight="700" text-anchor="start">
<tspan x="204" dy="0">REGLA 01 · REGLA 07 · CÁLCULO</tspan>
</text>
<text x="204" y="511" font-size="28" fill="#172e41" font-weight="700" text-anchor="start">
<tspan x="204" dy="0">Discriminar el IVA de cada producto</tspan>
</text>
<text x="204" y="548" font-size="24" fill="#506777" font-weight="400" text-anchor="start">
<tspan x="204" dy="0">Puntos = suma de (base sin IVA de cada producto × 5%)</tspan>
</text>
<text x="1366" y="468" font-size="23" fill="#2f7499" font-weight="700" text-anchor="end">
<tspan x="1366" dy="0">1 peso = 1 punto</tspan>
</text>
<path d="M 785 570 V 615" fill="none" stroke="#38566b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="180" y="615" width="1210" height="155" rx="18" fill="#fff" stroke="#2f7499" stroke-width="2.5"/>
<text x="204" y="648" font-size="21" fill="#2f7499" font-weight="700" text-anchor="start">
<tspan x="204" dy="0">REGLA 02 · REGLA 09 · ACUMULACIÓN</tspan>
</text>
<text x="204" y="691" font-size="28" fill="#172e41" font-weight="700" text-anchor="start">
<tspan x="204" dy="0">Registrar puntos, fecha y caducidad por acumulación</tspan>
</text>
<text x="204" y="748" font-size="24" fill="#506777" font-weight="400" text-anchor="start">
<tspan x="204" dy="0">Vencimiento: 6 meses. Controlar lo usado y lo caducado.</tspan>
</text>
<text x="204" y="719" font-size="23" fill="#506777" font-weight="400" text-anchor="start">
<tspan x="204" dy="0">Los puntos usados o caducados no vuelven a sumar al saldo.</tspan>
</text>
<path d="M 785 770 V 825" fill="none" stroke="#38566b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="350" y="825" width="870" height="125" rx="18" fill="#fff" stroke="#2f7499" stroke-width="2.5"/>
<text x="374" y="858" font-size="21" fill="#2f7499" font-weight="700" text-anchor="start">
<tspan x="374" dy="0">REGLA 04 · REGLA 05 · ENTRENADOR</tspan>
</text>
<text x="374" y="901" font-size="28" fill="#172e41" font-weight="700" text-anchor="start">
<tspan x="374" dy="0">Solicitar canje de productos a precio completo</tspan>
</text>
<text x="374" y="928" font-size="24" fill="#506777" font-weight="400" text-anchor="start">
<tspan x="374" dy="0">Bipro Classic: $249.900 → 249.900 puntos</tspan>
</text>
<path d="M 785 950 V 990" fill="none" stroke="#38566b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 785 990.0 L 1015.0 1070 L 785 1150.0 L 555.0 1070 Z" fill="#fff9e9" stroke="#c58a29" stroke-width="2.5"/>
<text x="785" y="1062" font-size="24" fill="#172e41" font-weight="700" text-anchor="middle">
<tspan x="785" dy="0">¿Puntos disponibles</tspan>
<tspan x="785" dy="32">suficientes?</tspan>
</text>
<path d="M 1015 1070 H 1125" fill="none" stroke="#38566b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="1047" y="1052" font-size="22" fill="#506777" font-weight="700" text-anchor="start">
<tspan x="1047" dy="0">No</tspan>
</text>
<rect x="1125" y="1015" width="310" height="115" rx="14" fill="#edf3f7" stroke="#bccdd7" stroke-width="2.5"/>
<text x="1280" y="1055" font-size="20" fill="#506777" font-weight="400" text-anchor="middle">
<tspan x="1280" dy="0">No completar el canje</tspan>
<tspan x="1280" dy="27">con puntos + dinero.</tspan>
<tspan x="1280" dy="27">Pago mixto no permitido.</tspan>
</text>
<path d="M 785 1150 V 1200" fill="none" stroke="#38566b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="805" y="1184" font-size="23" fill="#2f7499" font-weight="700" text-anchor="start">
<tspan x="805" dy="0">Sí</tspan>
</text>
<rect x="180" y="1200" width="1210" height="145" rx="18" fill="#fff" stroke="#2f7499" stroke-width="2.5"/>
<text x="204" y="1233" font-size="21" fill="#2f7499" font-weight="700" text-anchor="start">
<tspan x="204" dy="0">REGLA 09 · CONSUMO FIFO</tspan>
</text>
<text x="204" y="1276" font-size="28" fill="#172e41" font-weight="700" text-anchor="start">
<tspan x="204" dy="0">Redimir primero los puntos ganados más antiguos</tspan>
</text>
<text x="204" y="1323" font-size="24" fill="#506777" font-weight="400" text-anchor="start">
<tspan x="204" dy="0">Consumir solo los puntos requeridos; conservar el remanente vigente.</tspan>
</text>
<path d="M 785 1345 V 1400" fill="none" stroke="#38566b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="180" y="1400" width="1210" height="130" rx="18" fill="#fff" stroke="#2f7499" stroke-width="2.5"/>
<text x="204" y="1433" font-size="21" fill="#2f7499" font-weight="700" text-anchor="start">
<tspan x="204" dy="0">REGLA 10 · INFORMACIÓN TRIBUTARIA</tspan>
</text>
<text x="204" y="1476" font-size="28" fill="#172e41" font-weight="700" text-anchor="start">
<tspan x="204" dy="0">Discriminar el IVA de los productos canjeados</tspan>
</text>
<text x="204" y="1508" font-size="24" fill="#506777" font-weight="400" text-anchor="start">
<tspan x="204" dy="0">Persistir el IVA para los reportes.</tspan>
</text>
<path d="M 785 1530 V 1585" fill="none" stroke="#38566b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="280" y="1585" width="1010" height="120" rx="20" fill="#e5f1f8" stroke="#2f7499" stroke-width="2.5"/>
<text x="785" y="1632" font-size="27" fill="#2f7499" font-weight="800" text-anchor="middle">
<tspan x="785" dy="0">CANJE REGISTRADO</tspan>
</text>
<text x="785" y="1675" font-size="25" fill="#172e41" font-weight="400" text-anchor="middle">
<tspan x="785" dy="0">Puntos consumidos identificados · Saldo restante disponible</tspan>
</text>
<text x="90" y="1743" font-size="23" fill="#506777" font-weight="400" text-anchor="start">
<tspan x="90" dy="0">Disponible = utilizable; los incentivos desactivados aún no se pueden canjear.</tspan>
</text>
<rect x="1590" y="280" width="860" height="200" rx="20" fill="#fff3e8" stroke="#cb813b" stroke-width="2.5"/>
<text x="1614" y="318" font-size="22" fill="#a45a1a" font-weight="700" text-anchor="start">
<tspan x="1614" dy="0">REGLA 03 · REGLA 04 · REGLA 05</tspan>
</text>
<text x="1614" y="361" font-size="29" fill="#172e41" font-weight="700" text-anchor="start">
<tspan x="1614" dy="0">Compra del entrenador por la app</tspan>
</text>
<text x="1614" y="405" font-size="25" fill="#172e41" font-weight="400" text-anchor="start">
<tspan x="1614" dy="0">Con dinero: 25% de descuento en productos.</tspan>
</text>
<text x="1614" y="446" font-size="25" fill="#a45a1a" font-weight="700" text-anchor="start">
<tspan x="1614" dy="0">Canje: precio completo. Sin pagos mixtos.</tspan>
</text>
<rect x="1590" y="520" width="860" height="470" rx="20" fill="#edf6fc" stroke="#2f7499" stroke-width="2.5"/>
<text x="1614" y="558" font-size="23" fill="#2f7499" font-weight="700" text-anchor="start">
<tspan x="1614" dy="0">REGLA 06 · INCENTIVO POR REFERIDO</tspan>
</text>
<text x="2020" y="602" font-size="29" fill="#172e41" font-weight="700" text-anchor="middle">
<tspan x="2020" dy="0">A refiere a B</tspan>
</text>
<path d="M 2020 620 V 650" fill="none" stroke="#38566b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1690" y="650" width="660" height="70" rx="12" fill="#fff" stroke="#2f7499" stroke-width="2.5"/>
<text x="2020" y="694" font-size="26" fill="#172e41" font-weight="700" text-anchor="middle">
<tspan x="2020" dy="0">A: 50.000 puntos desactivados</tspan>
</text>
<path d="M 2020 720 V 750" fill="none" stroke="#38566b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 2020 750.0 L 2200.0 815 L 2020 880.0 L 1840.0 815 Z" fill="#fff9e9" stroke="#c58a29" stroke-width="2.5"/>
<text x="2020" y="807" font-size="24" fill="#172e41" font-weight="700" text-anchor="middle">
<tspan x="2020" dy="0">¿Compra un</tspan>
<tspan x="2020" dy="32">cliente de B?</tspan>
</text>
<path d="M 1840 815 H 1770 V 905" fill="none" stroke="#38566b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="1780" y="796" font-size="22" fill="#506777" font-weight="700" text-anchor="start">
<tspan x="1780" dy="0">No</tspan>
</text>
<path d="M 2200 815 H 2260 V 905" fill="none" stroke="#38566b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="2222" y="796" font-size="22" fill="#2f7499" font-weight="700" text-anchor="start">
<tspan x="2222" dy="0">Sí</tspan>
</text>
<rect x="1620" y="905" width="300" height="60" rx="12" fill="#fff" stroke="#bccdd7" stroke-width="2.5"/>
<text x="1770" y="944" font-size="22" fill="#506777" font-weight="400" text-anchor="middle">
<tspan x="1770" dy="0">Siguen desactivados</tspan>
</text>
<rect x="1945" y="905" width="475" height="60" rx="12" fill="#e5f1f8" stroke="#2f7499" stroke-width="2.5"/>
<text x="2182" y="931" font-size="22" fill="#172e41" font-weight="700" text-anchor="middle">
<tspan x="2182" dy="0">A: activa los 50.000 puntos.</tspan>
</text>
<text x="2182" y="956" font-size="22" fill="#172e41" font-weight="400" text-anchor="middle">
<tspan x="2182" dy="0">B: gana 5% de la base sin IVA.</tspan>
</text>
<rect x="1590" y="1030" width="860" height="700" rx="20" fill="#fff9e9" stroke="#c58a29" stroke-width="2.5"/>
<text x="1614" y="1070" font-size="23" fill="#a46612" font-weight="700" text-anchor="start">
<tspan x="1614" dy="0">REGLA 08 · REGLA 11 · APP DE DIETAS</tspan>
</text>
<rect x="1770" y="1100" width="500" height="65" rx="14" fill="#fff" stroke="#c58a29" stroke-width="2.5"/>
<text x="2020" y="1142" font-size="28" fill="#172e41" font-weight="700" text-anchor="middle">
<tspan x="2020" dy="0">Primer mes gratis</tspan>
</text>
<text x="2020" y="1200" font-size="22" fill="#506777" font-weight="400" text-anchor="middle">
<tspan x="2020" dy="0">Después del primer mes</tspan>
</text>
<path d="M 2020 1220.0 L 2220.0 1290 L 2020 1360.0 L 1820.0 1290 Z" fill="#fff9e9" stroke="#c58a29" stroke-width="2.5"/>
<text x="2020" y="1282" font-size="24" fill="#172e41" font-weight="700" text-anchor="middle">
<tspan x="2020" dy="0">¿Cumple la meta</tspan>
<tspan x="2020" dy="32">de ventas?</tspan>
</text>
<path d="M 1820 1290 H 1775 V 1400" fill="none" stroke="#38566b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="1734" y="1272" font-size="22" fill="#2f7499" font-weight="700" text-anchor="start">
<tspan x="1734" dy="0">Sí</tspan>
</text>
<path d="M 2220 1290 H 2260 V 1400" fill="none" stroke="#38566b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="2240" y="1272" font-size="22" fill="#506777" font-weight="700" text-anchor="start">
<tspan x="2240" dy="0">No</tspan>
</text>
<rect x="1620" y="1400" width="310" height="105" rx="14" fill="#e5f1f8" stroke="#2f7499" stroke-width="2.5"/>
<text x="1775" y="1445" font-size="25" fill="#172e41" font-weight="700" text-anchor="middle">
<tspan x="1775" dy="0">Acceso a la app</tspan>
<tspan x="1775" dy="34">de dietas</tspan>
</text>
<rect x="1960" y="1400" width="460" height="105" rx="14" fill="#fff" stroke="#c58a29" stroke-width="2.5"/>
<text x="2190" y="1442" font-size="23" fill="#172e41" font-weight="700" text-anchor="middle">
<tspan x="2190" dy="0">Acceso mediante puntos</tspan>
<tspan x="2190" dy="34">Importe mensual por aclarar</tspan>
</text>
<rect x="1620" y="1540" width="800" height="75" rx="14" fill="#fff" stroke="#c58a29" stroke-width="2.5"/>
<text x="2020" y="1572" font-size="23" fill="#172e41" font-weight="400" text-anchor="middle">
<tspan x="2020" dy="0">Validar a diario el saldo disponible del mes.</tspan>
<tspan x="2020" dy="29">Rango mensual y forma de cobro por definir.</tspan>
</text>
<text x="1614" y="1656" font-size="23" fill="#a46612" font-weight="700" text-anchor="start">
<tspan x="1614" dy="0">El texto indica «50,000 mil puntos» y 49.800 puntos</tspan>
</text>
<text x="1614" y="1693" font-size="23" fill="#a46612" font-weight="400" text-anchor="start">
<tspan x="1614" dy="0">por 4 Bipro. Confirmar importe, meta y rango mensual.</tspan>
</text>
<rect x="60" y="1810" width="2440" height="245" rx="22" fill="#fff" stroke="#bdd5e0" stroke-width="2.5"/>
<text x="90" y="1857" font-size="23" fill="#172e41" font-weight="800" text-anchor="start">
<tspan x="90" dy="0">LECTURA Y ACLARACIONES</tspan>
</text>
<rect x="90" y="1882" width="34" height="27" rx="6" fill="#edf6fc" stroke="#2f7499" stroke-width="2.5"/>
<text x="139" y="1904" font-size="23" fill="#172e41" font-weight="400" text-anchor="start">
<tspan x="139" dy="0">Puntos y beneficios</tspan>
</text>
<rect x="500" y="1882" width="34" height="27" rx="6" fill="#fff3e8" stroke="#cb813b" stroke-width="2.5"/>
<text x="549" y="1904" font-size="23" fill="#172e41" font-weight="400" text-anchor="start">
<tspan x="549" dy="0">Compras</tspan>
</text>
<rect x="810" y="1882" width="34" height="27" rx="6" fill="#fff9e9" stroke="#c58a29" stroke-width="2.5"/>
<text x="859" y="1904" font-size="23" fill="#172e41" font-weight="400" text-anchor="start">
<tspan x="859" dy="0">Decisión o importe por aclarar</tspan>
</text>
<text x="90" y="1960" font-size="23" fill="#506777" font-weight="400" text-anchor="start">
<tspan x="90" dy="0">Cálculo: 5% antes de IVA por producto.</tspan>
<tspan x="90" dy="32">Precisión y redondeo no están definidos.</tspan>
</text>
<text x="910" y="1960" font-size="23" fill="#506777" font-weight="400" text-anchor="start">
<tspan x="910" dy="0">Saldo: FIFO, vencimiento por acumulación</tspan>
<tspan x="910" dy="32">y control de puntos usados o caducados.</tspan>
</text>
<text x="1720" y="1960" font-size="23" fill="#506777" font-weight="400" text-anchor="start">
<tspan x="1720" dy="0">Dietas: aclarar importe y operación</tspan>
<tspan x="1720" dy="32">del control diario de puntos mensuales.</tspan>
</text>
<text x="60" y="2101" font-size="22" fill="#496578" font-weight="400" text-anchor="start">
<tspan x="60" dy="0">Fuente representada: docs/reglas-de-negocio.md · Las referencias «Regla» corresponden a sus 11 numerales.</tspan>
</text>
</g></svg>